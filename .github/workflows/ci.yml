name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  phpcs:
    name: PHP Coding Standards
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring
        coverage: none
    
    - name: Validate composer.json
      run: composer validate
    
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Run PHPCS
      timeout-minutes: 5
      run: composer run phpcs

  phpunit:
    name: WordPress ${{ matrix.wordpress-version }} / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress-version: '6.0'
            php-version: '8.1'
          - wordpress-version: '6.5'
            php-version: '8.2'
          - wordpress-version: '6.9'
            php-version: '8.3'
          - wordpress-version: '7.0'
            php-version: '8.4'
          - wordpress-version: '7.1'
            php-version: '8.1'
          - wordpress-version: '7.1'
            php-version: '8.2'
          - wordpress-version: '7.1'
            php-version: '8.3'
          - wordpress-version: '7.1'
            php-version: '8.4'
          - wordpress-version: '7.1'
            php-version: '8.5'
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, mysqli
        coverage: none
    
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Setup WordPress test environment
      env:
        WP_VERSION: ${{ matrix.wordpress-version }}
      run: |
        bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 "$WP_VERSION"
    
    - name: Run PHPUnit
      run: composer run phpunit

  i18n:
    name: Check Internationalization
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Check translation files exist
      run: |
        if [ ! -f languages/headless-login-guard.pot ]; then
          echo "POT file not found!"
          exit 1
        fi
        echo "✓ Translation template exists"
